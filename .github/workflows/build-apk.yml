name: Build and Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'adopt'

    - name: Make gradlew executable
      run: chmod +x Mindblooom_App/gradlew
      
    - name: Build Debug APK
      run: |
        cd Mindblooom_App
        ./gradlew assembleDebug
    
    - name: Build Release APK
      run: |
        cd Mindblooom_App
        ./gradlew assembleRelease

    - name: Upload Debug APK to artifacts
      uses: actions/upload-artifact@v3
      with:
        name: Mindblooom-Debug
        path: Mindblooom_App/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload Release APK to artifacts
      uses: actions/upload-artifact@v3
      with:
        name: Mindblooom-Release
        path: Mindblooom_App/app/build/outputs/apk/release/app-release.apk
        retention-days: 30

    - name: Create Release Notes
      id: release_notes
      run: |
        echo "## Mindblooom APK Build" > release_notes.md
        echo "**Build Date:** $(date)" >> release_notes.md
        echo "**Commit:** ${{ github.sha }}" >> release_notes.md
        echo "**Branch:** ${{ github.ref_name }}" >> release_notes.md
        echo "" >> release_notes.md
        echo "### Available Downloads:" >> release_notes.md
        echo "- **Debug APK** - For testing and development" >> release_notes.md
        echo "- **Release APK** - For production use (unsigned)" >> release_notes.md
        cat release_notes.md

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          Mindblooom_App/app/build/outputs/apk/debug/app-debug.apk
          Mindblooom_App/app/build/outputs/apk/release/app-release.apk
        body_path: release_notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Build Summary
      run: |
        echo "✅ Build completed successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📱 APK Files Generated:" >> $GITHUB_STEP_SUMMARY
        echo "- Debug APK: Mindblooom-Debug artifact" >> $GITHUB_STEP_SUMMARY
        echo "- Release APK: Mindblooom-Release artifact" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 How to Download:" >> $GITHUB_STEP_SUMMARY
        echo "1. Go to the Actions tab" >> $GITHUB_STEP_SUMMARY
        echo "2. Click on the latest workflow run" >> $GITHUB_STEP_SUMMARY
        echo "3. Scroll to the 'Artifacts' section" >> $GITHUB_STEP_SUMMARY
        echo "4. Download the APK you need" >> $GITHUB_STEP_SUMMARY
