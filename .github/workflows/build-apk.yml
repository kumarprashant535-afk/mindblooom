name: Build and Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Regenerate Gradle wrapper
      run: |
        cd Mindblooom_App/android
        rm -rf gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
        gradle wrapper --gradle-version 8.6
        chmod +x gradlew

    - name: Build Debug APK
      run: |
        cd Mindblooom_App/android
        ./gradlew assembleDebug

    - name: Build Release APK
      run: |
        cd Mindblooom_App/android
        ./gradlew assembleRelease

    - name: Upload Debug APK to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Mindblooom-Debug
        path: Mindblooom_App/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload Release APK to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Mindblooom-Release
        path: Mindblooom_App/android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30

    - name: Create Build Summary
      if: always()
      run: |
        echo "✅ Build process completed!" >> $GITHUB_STEP_SUMMARY
        echo "📱 APK Files available in Artifacts section" >> $GITHUB_STEP_SUMMARY
