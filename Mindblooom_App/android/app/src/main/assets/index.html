<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mindblooom V3 — Play. Relax. Think. Grow.</title>
<style>
:root{--ink:#263149;--muted:#738096;--bg1:#faf7ff;--bg2:#effaf6;--card:#ffffffdf;--line:#e7ebf3;--accent:#8194ff;--good:#4f9b76}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2) 58%,#fff9ee);min-height:100vh}
.app{max-width:820px;margin:auto;padding:18px 16px 35px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:27px;font-weight:850}.tag{font-size:12px;color:var(--muted)}button{font:inherit}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:15px;padding:9px 12px;cursor:pointer}.btn.dark{background:var(--ink);color:white;border:0}.row{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px 0}.stat{background:#ffffffb8;border:1px solid #fff;border-radius:17px;padding:9px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}
.card{background:var(--card);border:1px solid #fff;border-radius:28px;padding:21px;box-shadow:0 18px 50px #34405b12;backdrop-filter:blur(8px)}.maptitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.world{min-height:105px;border:1px solid var(--line);background:#fbfcff;border-radius:20px;padding:14px;cursor:pointer;text-align:left}.world.active{outline:2px solid #cfd6ff;background:#f4f5ff}.world.locked{opacity:.48;cursor:not-allowed}.world .emoji{font-size:25px}.world b{display:block;margin-top:6px}.world small{color:var(--muted)}.bar{height:7px;background:#e9edf5;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent)}
.game{margin-top:15px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.question{font-size:25px;font-weight:800;line-height:1.22;margin:23px 0 8px}.tip{font-size:12px;color:var(--muted);margin-bottom:14px}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.opt{border:1px solid transparent;background:#f3f6ff;border-radius:17px;padding:16px;min-height:65px;cursor:pointer;font-size:18px;color:var(--ink)}.opt:hover{transform:translateY(-1px);border-color:#d8defb}.feedback{text-align:center;min-height:27px;margin:13px 0;font-weight:700}.next{display:block;margin:auto;border:0;background:var(--ink);color:white;border-radius:16px;padding:11px 21px;cursor:pointer}.hide{display:none}.garden{text-align:center;font-size:39px;letter-spacing:2px;margin:18px 0 3px}.foot{text-align:center;color:var(--muted);font-size:11px}
.overlay{position:fixed;inset:0;background:#27314955;display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}.modal{width:min(440px,100%);background:#fff;border-radius:25px;padding:24px;box-shadow:0 25px 80px #0002}.modal h2{margin-top:0}.modal p{color:var(--muted)}.choice{display:flex;gap:9px}.choice .btn{flex:1;padding:13px}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.map{grid-template-columns:repeat(2,1fr)}.options{grid-template-columns:1fr}.question{font-size:22px}}
</style>
<link rel="manifest" href="./manifest.webmanifest"></head>
<body>
<div class="app">
  <div class="top"><div><div class="brand">🌱 Mindblooom</div><div class="tag">Play. Relax. Think. Grow.</div></div>
    <div class="row"><button class="btn" onclick="resetGame()">Reset</button><button class="btn dark" onclick="resetMode()">🧘 Reset Mind</button></div>
  </div>
  <div class="stats" id="stats"></div>

  <section class="card">
    <div class="maptitle"><b>🌍 Your Mind Journey</b><span id="profile" class="tag"></span></div>
    <div class="map" id="map"></div>
    <div class="game" id="game"></div>
  </section>
  <div class="garden" id="garden">🌱</div>
  <div class="foot">Ad-free • No pressure • Family friendly • 999 levels</div>
</div>

<script>
const worlds=[
 ["🌱","Discovery","Observation"],["🎯","Focus","Concentration"],["🧠","Memory","Recall"],["🧩","Logic","Reasoning"],
 ["🔷","Patterns","Recognition"],["⚡","Quick Think","Agility"],["💡","Creativity","Ideas"],["🌈","Mastery","Combination"],["🌟","Mindblooom","Everything"]
];
const bank=[
 ["Find the different shape",["● ● ●","● ○ ●","● ● ●","● ● ●"],1,"focus"],
 ["What comes next? 2, 4, 6, ?",["7","8","9","10"],1,"logic"],
 ["Remember: 🍎 🐟 🌙. Which came second?",["🍎","🐟","🌙","🌸"],1,"memory"],
 ["Which pair is identical?",["ABCD / ABCE","MINT / MINT","TREE / TERE","PLAY / PLYA"],1,"focus"],
 ["Which one does NOT belong?",["🐶","🐱","🐭","🚲"],3,"logic"],
 ["Pattern: 🔵 🟢 🔵 🟢 ?",["🔵","🟢","🟡","🔴"],0,"pattern"],
 ["Count the stars: ⭐ ⭐ 🌙 ⭐",["2","3","4","5"],2,"focus"],
 ["Which word is a color?",["TABLE","BLUE","APPLE","RIVER"],1,"logic"],
 ["Complete: 5, 10, 15, ?",["18","20","25","30"],1,"logic"],
 ["Memory: 🐱 🌳 🚗 ☀️. What was third?",["🐱","🌳","🚗","☀️"],2,"memory"],
 ["Which shape completes: ▲ ■ ▲ ■ ?",["●","▲","■","◆"],1,"pattern"],
 ["Which number is smallest?",["14","41","9","19"],2,"focus"],
 ["Spot the pair that matches exactly.",["BIRD / BIRD","MOON / MONN","STAR / STARE","TREE / TRRE"],0,"memory"],
 ["What comes next? 1, 3, 5, 7, ?",["8","9","10","11"],1,"logic"],
 ["Useful for telling time?",["🕰️","🍎","🌳","🐟"],0,"logic"],
 ["Pattern: 🟡 🟡 🔵 🟡 🟡 🔵 ?",["🟡","🔵","🟢","🔴"],0,"pattern"],
 ["Which word does not belong?",["CAT","DOG","BIRD","TABLE"],3,"logic"],
 ["Memory: 🍋 🍓 🥝 🍉. Which was last?",["🍋","🍓","🥝","🍉"],3,"memory"],
 ["Choose the calmest sequence.",["🌊 ~ ~ ~","⚡ ⚡ ⚡","💨 💨 💨","🔥 🔥 🔥"],0,"calm"],
 ["Fruit and a color?",["Orange","Table","River","Cloud"],0,"creativity"],
 ["What is 3 + 4?",["6","7","8","9"],1,"logic"],
 ["Which is the mirror of ▶?",["◀","▲","▼","●"],0,"pattern"],
 ["Remember: 🌸 🐝 🌳. What was first?",["🌸","🐝","🌳","🌙"],0,"memory"],
 ["Which has the most sides?",["△","□","⬟","○"],2,"logic"],
 ["Complete: A, B, C, ?",["D","E","F","Z"],0,"pattern"],
 ["Find the matching pair.",["SUN / SON","MOON / MOON","STAR / STOR","TREE / TRIE"],1,"focus"],
 ["Which comes first alphabetically?",["DOG","APPLE","CAT","BALL"],1,"logic"],
 ["Count: 🍎 🍎 🍌 🍎 🍌",["2","3","4","5"],1,"focus"],
 ["What belongs with a book?",["Reading","Swimming","Cooking","Running"],0,"creativity"]
];
const skillName={focus:"Focus",logic:"Logic",memory:"Memory",pattern:"Pattern",calm:"Calm",creativity:"Creativity"};
const skillEmoji={focus:"👁️",logic:"🧩",memory:"🧠",pattern:"🔷",calm:"🌿",creativity:"💡"};
let S=JSON.parse(localStorage.getItem("mb3")||"null")||{level:0,xp:0,p:{focus:0,logic:0,memory:0,pattern:0,calm:0,creativity:0},profile:"Adult",daily:0,lastDay:"",mistakes:0};

function save(){localStorage.setItem("mb3",JSON.stringify(S))}
function world(){return Math.min(8,Math.floor(S.level/111))}
function current(){return bank[S.level%bank.length]}
function req(skill){return Math.floor(S.level/7)+(skill==="calm"?0:0)}
function unlocked(n){return S.p[n[3]]>=req(n[3])}
function renderStats(){
 stats.innerHTML=Object.keys(S.p).map(k=>`<div class="stat"><b>${skillEmoji[k]} ${S.p[k]}</b><span>${skillName[k]}</span></div>`).join("")+
 `<div class="stat"><b>⭐ ${S.xp}</b><span>XP</span></div><div class="stat"><b>🔥 ${S.daily}</b><span>Today</span></div>`;
 profile.textContent=`${S.profile} • Level ${S.level+1}/999`;
}
function renderMap(){
 map.innerHTML=worlds.map((w,i)=>{
   let start=i*111, end=i===8?998:start+110, done=Math.max(0,Math.min(end,start+110,S.level)-start+1);
   let lock=S.level<start;
   return `<button class="world ${i===world()?"active":""} ${lock?"locked":""}" ${lock?"disabled":`onclick="jump(${start})"`}>
    <span class="emoji">${w[0]}</span><b>${w[1]}</b><small>${w[2]} • ${lock?"Locked":`${Math.min(111,done)}/111`}</small>
    <div class="bar"><i style="width:${Math.min(100,done/111*100)}%"></i></div></button>`;
 }).join("");
}
function renderGame(){
 if(S.level>=998){game.innerHTML=`<div style="text-align:center;padding:18px"><div style="font-size:52px">🌟</div><div class="question">Mindblooom Mastery</div><p>You reached Level 999. Your journey is complete.</p><button class="next" onclick="practice()">Practice a skill →</button></div>`;return}
 const n=current(),r=req(n[3]),ok=unlocked(n);
 game.innerHTML=`<div class="meta"><span>${skillEmoji[n[3]]} ${skillName[n[3]]} Challenge</span><b>Level ${S.level+1}</b></div>
 <div class="question">${n[0]}</div><div class="tip">${ok?"Take your time. There is no penalty for thinking.":"🌿 Build your "+skillName[n[3]]+" power before this challenge."}</div>
 <div class="options">${n[1].map((x,i)=>`<button class="opt" ${ok?"":"disabled"} onclick="answer(${i})">${x}</button>`).join("")}</div>
 ${!ok?`<div class="feedback">Power needed: <b>${r}</b> • You have <b>${S.p[n[3]]}</b></div>`:"<div class='feedback' id='fb'></div>"}
 <button class="next hide" id="next" onclick="advance()">Continue →</button>`;
}
function render(){renderStats();renderMap();renderGame();garden.textContent="🌱"+"🌿".repeat(Math.min(7,Math.floor(S.level/35)))+"🌳".repeat(Math.min(4,Math.floor(S.level/220)))}
function answer(i){
 const n=current(),fb=document.getElementById("fb");
 document.querySelectorAll(".opt").forEach(x=>x.disabled=true);
 if(i===n[2]){
   S.p[n[3]]++;S.xp+=10;S.daily++;fb.textContent=`✨ Great! ${skillName[n[3]]} power +1`;fb.style.color="var(--good)";
   document.getElementById("next").classList.remove("hide");
 }else{
   S.mistakes++;fb.textContent="🌿 Almost. No stress — try again.";fb.style.color="#9a7200";
   document.querySelectorAll(".opt").forEach(x=>x.disabled=false);
 }
 save();renderStats();
}
function advance(){S.level=Math.min(998,S.level+1);save();render()}
function jump(x){if(x<=S.level){S.level=x;save();render()}}
function practice(){
 let k=Object.keys(S.p).sort((a,b)=>S.p[a]-S.p[b])[0];
 const ix=bank.findIndex(n=>n[3]===k); if(ix>=0){S.level=Math.min(S.level,ix);save();render()}
}
function resetMode(){game.innerHTML=`<div style="text-align:center;padding:15px"><div style="font-size:62px">🌸</div><div class="question">Two-Minute Reset</div><p>There is no score here. Breathe slowly and let the flower guide your pace.</p><div style="font-size:75px;animation:b 8s infinite">🌼</div><p class="tag">Inhale as it grows • Exhale as it shrinks</p><button class="next" onclick="render()">Return gently →</button></div>`}
function resetGame(){if(confirm("Reset all Mindblooom progress?")){S={level:0,xp:0,p:{focus:0,logic:0,memory:0,pattern:0,calm:0,creativity:0},profile:S.profile,daily:0,lastDay:"",mistakes:0};save();render()}}
if(!localStorage.getItem("mb3_profile")){document.body.insertAdjacentHTML("beforeend",`<div class="overlay"><div class="modal"><h2>Welcome to Mindblooom 🌱</h2><p>A calm brain game for curious kids and busy adults.</p><div class="choice"><button class="btn" onclick="setProfile('Kids')">👧 Kids</button><button class="btn" onclick="setProfile('Adult')">👨‍💼 Adult</button></div></div></div>`);localStorage.setItem("mb3_profile","1")}
function setProfile(x){S.profile=x;save();document.querySelector(".overlay").remove();render()}
render();
</script>
<style>@keyframes b{0%,100%{transform:scale(.72)}50%{transform:scale(1.12)}}</style>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}</script></body></html>
